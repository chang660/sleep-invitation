<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1a15"/>
      <stop offset="50%" stop-color="#192823"/>
      <stop offset="100%" stop-color="#2a4538"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰星星 -->
  <circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="1120" cy="120" r="2.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="200" cy="560" r="1.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="1050" cy="520" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="600" cy="50" r="1.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="950" cy="180" r="1" fill="rgba(255,255,255,0.2)"/>
  <circle cx="150" cy="300" r="2" fill="rgba(255,255,255,0.15)"/>

  <!-- 左上装饰线 -->
  <line x1="40" y1="40" x2="160" y2="40" stroke="rgba(255,215,0,0.2)" stroke-width="1"/>
  <line x1="40" y1="40" x2="40" y2="160" stroke="rgba(255,215,0,0.2)" stroke-width="1"/>

  <!-- 右下装饰线 -->
  <line x1="1160" y1="590" x2="1040" y2="590" stroke="rgba(255,215,0,0.2)" stroke-width="1"/>
  <line x1="1160" y1="590" x2="1160" y2="470" stroke="rgba(255,215,0,0.2)" stroke-width="1"/>

  <!-- 中央内容 -->
  <text x="600" y="160" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#fff" letter-spacing="10">山东睡眠疗愈交流会</text>

  <rect x="500" y="190" width="200" height="2" rx="1" fill="url(#gold)" opacity="0.6"/>

  <text x="600" y="250" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="rgba(255,255,255,0.5)" letter-spacing="6">邀请函</text>

  <!-- 时间地点 -->
  <rect x="350" y="310" width="500" height="100" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,215,0,0.1)" stroke-width="1"/>

  <text x="600" y="345" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="rgba(255,255,255,0.7)" letter-spacing="2">📅 2026年6月18日 12:00 ～ 6月19日 12:00</text>
  <text x="600" y="385" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="rgba(255,215,0,0.6)" letter-spacing="2">📍 齐河阿尔卡迪亚温泉高尔夫国际酒店</text>

  <!-- 主办 -->
  <text x="600" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="rgba(255,255,255,0.3)" letter-spacing="4">主办：悦心愈商 · 协办：慈航大健康</text>

  <!-- 底部 Slogan -->
  <text x="600" y="530" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="url(#gold)" letter-spacing="5" font-weight="700">让每一个家庭都有一位幸福催眠师</text>

  <!-- 邀请按钮 -->
  <rect x="480" y="558" width="240" height="44" rx="22" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="1"/>
  <text x="600" y="586" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="rgba(255,215,0,0.4)" letter-spacing="4">诚邀莅临</text>
</svg>
